; PlatformIO Project Configuration File for Seeed Studio XIAO ESP32-S3 + EE04 ePaper Display
; Hardware: Seeed Studio TRMNL 7.5" OG DIY Kit (EE04 Display Board + XIAO ESP32-S3 Plus)

[env:seeed_xiao_esp32s3]
platform = espressif32
board = seeed_xiao_esp32s3
framework = arduino

; ESP32-S3 Hardware Settings
board_build.mcu = esp32s3
board_build.f_cpu = 240000000L

; Serial Monitor & Upload Settings
monitor_speed = 115200
monitor_filters = esp32_exception_decoder
upload_port = /dev/cu.usbmodem*
upload_speed = 460800

; Build Flags for ESP32-S3 Native USB CDC & PSRAM
build_flags = 
    -DBOARD_HAS_PSRAM
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1

; Required Libraries
lib_deps = 
    zinggjm/GxEPD2 @ ^1.5.8
    adafruit/Adafruit GFX Library @ ^1.11.9
    adafruit/Adafruit BusIO @ ^1.16.1
    bblanchon/ArduinoJson @ ^7.0.4
